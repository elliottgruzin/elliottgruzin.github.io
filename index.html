<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>elliott gruzin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F0EAD6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #444;
            text-transform: lowercase;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            line-height: 2;
            font-size: 1.1rem;
        }

        .line {
            display: block;
            margin-bottom: 0.5em;
        }

        .indent-0 { margin-left: 0; }
        .indent-1 { margin-left: 2rem; }
        .indent-2 { margin-left: 4rem; }
        .indent-3 { margin-left: 1rem; }
        .indent-4 { margin-left: 3rem; }

        .name {
            font-size: 1.4rem;
            margin-bottom: 1.5em;
        }

        .spacer {
            height: 1.5em;
        }

        a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #333;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem;
            }

            .indent-1 { margin-left: 1rem; }
            .indent-2 { margin-left: 2rem; }
            .indent-3 { margin-left: 0.5rem; }
            .indent-4 { margin-left: 1.5rem; }
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="line name indent-0">elliott gruzin</span>

        <div class="spacer"></div>

        <span class="line indent-2">data scientist</span>
        <span class="line indent-1">london</span>

        <div class="spacer"></div>

        <span class="line indent-3"><a href="mailto:elliottgruzin@gmail.com">email</a></span>
        <span class="line indent-4"><a href="https://linkedin.com/in/elliott-gruzin">linkedin</a></span>
        <span class="line indent-1"><a href="https://github.com/elliottgruzin">github</a></span>
    </div>
</body>

</html>
